name: qbootctl-static

# Build a static (musl) arm64 qbootctl binary for on-device slot switching.
# Artifact: qbootctl-static-<sha> — drop it into the piano-switch KSU module.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout qbootctl
        uses: actions/checkout@v5
        with:
          repository: linux-msm/qbootctl
          ref: main
          path: src
          persist-credentials: false

      - name: Build static binary (Alpine musl)
        run: |
          docker run --rm -v "$PWD/src":/src alpine:latest sh -eu -c '
            apk add --no-cache build-base meson ninja linux-headers zlib-static zlib-dev
            cd /src
            meson setup build --buildtype release \
                -Dc_link_args="-static -Os" \
                -Dcpp_link_args="-static -Os"
            ninja -C build
            strip build/qbootctl
            ./build/qbootctl || true   # smoke: prints usage, exit !=0 is fine
            cp build/qbootctl /src/qbootctl-static
          '
          file src/qbootctl-static || true
          ls -la src/qbootctl-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbootctl-static-${{ github.sha }}
          path: src/qbootctl-static
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="qbootctl-ci-${GITHUB_SHA::12}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "qbootctl static $tag" \
            --notes "Static musl arm64 qbootctl (built from linux-msm/qbootctl@main)." \
            src/qbootctl-static || true
          gh release upload "$tag" --clobber --repo "$GITHUB_REPOSITORY" \
            src/qbootctl-static
